面对婶婶索要收入，阿禾保留售卖收据，开始独立记账。\",title:\"第一张收据，我自己收着\",evidence:{title:\"第一张售卖收据\",text:\"小店第一件作品的售卖收据。它记录了阿禾独立挣得的第一笔收入；这是经营记录，不是遗产权属证明。\"},lines:[[\"林阿姨\",\"我在橱窗里一眼就看中了这条手串。谢谢你，把自己的喜欢做得这样认真。\"],[\"婶婶\",\"既然卖出去了，就把钱交来。你这么年轻，还是我们替你管着稳妥。\"],[\"阿禾\",\"这是我的售卖收入，我自己记账。父母留下的钱，我们也还需要一份清楚的说明。\"],[\"奶奶\",\"别被她的话吓住。今天先把收据收好，给自己记上第一笔。\"],[\"阿禾\",\"原来我做的东西，真的有人珍惜。这张收据，我自己收着。\"]]},{id:\"stolen-design\",chapter:0,afterOrder:\"sea\",summary:\"第二件售出的作品带来朋友，也带来抄袭风波。小满和阿禾一起保留原稿，准备回应流言。\",title:\"留下自己的名字\",evidence:{title:\"带日期的配珠草图\",text:\"原创手串的草图、试串照片和售卖记录放在一起，形成可供核对的创作记录。\"},lines:[[\"小满\",\"你橱窗里的作品我很喜欢。但邻店把你的图样换了名字，还说你才是模仿的人。\"],[\"婶婶\",\"我早说你撑不起店。被人找上门，别指望我们替你出头。\"],[\"阿禾\",\"小时候被人堵在路上嘲笑，我总是躲。这次我还是害怕，可我不能把自己的作品也让出去。\"],[\"小满\",\"我记得你把作品放进橱窗的日子。把你的草图和试串也放在一起，我们按时间说清楚。\"],[\"阿禾\",\"好。继续做自己喜欢的作品，每一次修改也都记下来。\"]]},{id:\"design-record\",chapter:1,afterOrder:\"rose\",summary:\"许老师核对了创作过程。阿禾开始靠记录和可信的帮助保护作品。\",title:\"用作品说话\",evidence:{title:\"顾客确认的创作记录\",text:\"许老师确认了作品展示和制作过程。记录让事实更清楚，也让阿禾学会在需要时求助。\"},lines:[[\"许老师\",\"你放进橱窗的手串很用心。草图到成品的过程，我也亲眼见过。你可以把我确认的记录放进说明里。\"],[\"叔叔\",\"别人说你抄，你就别做了。把店关了，省得丢家里的脸。\"],[\"阿禾\",\"我不会因为几句话就关店。我的作品有记录，我也会继续做自己喜欢的手作。\"],[\"许老师\",\"把事实逐项公开，别跟着流言争吵。如果侵权继续，再寻求合适的专业帮助。\"],[\"奶奶\",\"今晚先吃顿热饭。你已经迈出一步了，不必一口气扛完。\"]]},{id:\"unfair-contract\",chapter:1,afterOrder:\"forest\",summary:\"回头客帮小店稳住口碑，新的采购方却要求买断署名。阿禾决定不拿独立经营换展位。\",title:\"更大的机会，更小的名字？\",evidence:{title:\"标出争议的合作草案\",text:\"草案中的买断署名、独家经营和结算条款被逐项标出。阿禾没有签署它，准备提出修改。\"},lines:[[\"林阿姨\",\"花园重新开张了，你的小店也要好好开下去。我会把真实的选购经历告诉朋友。\"],[\"采购方\",\"我们可以给你展位。但所有设计署我们品牌的名字，你以后也只能替我们供货。\"],[\"叔叔\",\"这么大的机会你还挑？经营权交给我管，这份合同我替你签。\"],[\"阿禾\",\"我的店和我的作品，由我决定。这份合同先不签，署名、独家和结算条款都要重新谈。\"],[\"小满\",\"我已经找到可以独立报名的市集。下一条参展作品，我们把你的名字写清楚。\"]]},{id:\"own-name\",chapter:2,afterOrder:\"violet\",summary:\"作品终于以自己的名字参展，叔婶却仍用遗产压她低头。阿禾开始整理现有材料寻求咨询。\",title:\"署名是我的，人生也是\",evidence:{title:\"阿禾手作的参展卡\",text:\"自己的名字终于留在展签上。它证明的是这一步经营成长；父母遗产的去向仍需要核查。\"},lines:[[\"小满\",\"展签写好了：设计与制作，阿禾手作。已经有人来问下一件作品了。\"],[\"婶婶\",\"翅膀硬了？再追问你爸妈那些钱，以后别来找我们。\"],[\"阿禾\",\"我不会交出
